<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجري</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>متجري 🛒</h1>

  <h2>إنشاء حساب</h2>

  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <br><br>

  <input id="password" type="password" placeholder="كلمة المرور">
  <br><br>

  <button onclick="register()">إنشاء حساب</button>
  <button onclick="login()">تسجيل الدخول</button>

  <p id="message"></p>

  <script>
    const SUPABASE_URL = "https://evqmpbhozwpujjrxkbat.supabase.co";

    const SUPABASE_KEY = "sb_publishable_4n7k-PEyPPNA9RcFVMa4Cg_lqW19wZu";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        document.getElementById("message").textContent =
          "اكتب البريد وكلمة المرور";
        return;
      }

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      document.getElementById("message").textContent =
        error ? error.message : "تم إنشاء الحساب ✅";
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      document.getElementById("message").textContent =
        error ? error.message : "تم تسجيل الدخول ✅";
    }
  </script>

</body>
</html>
