<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>متجري</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .balance {
      background: #eee;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>متجري</h1>

  <!-- تسجيل الدخول -->
  <div id="login">

    <h2>تسجيل الدخول</h2>

    <input
      type="email"
      id="email"
      placeholder="أدخل بريدك الإلكتروني"
    >

    <button onclick="sendOTP()">
      إرسال رمز الدخول
    </button>

    <div id="otpArea" class="hidden">

      <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        placeholder="أدخل رمز الـ 6 أرقام"
      >

      <button onclick="verifyOTP()">
        تأكيد الرمز
      </button>

      <button onclick="sendOTP()">
        إعادة إرسال الرمز
      </button>

    </div>

    <div id="message"></div>

  </div>


  <!-- الحساب -->
  <div id="account" class="hidden">

    <h2>حسابي</h2>

    <div class="info">
      البريد:
      <span id="userEmail"></span>
    </div>

    <div class="balance">
      الرصيد:
      <span id="balance">0.00</span>
      د.ل
    </div>


    <h2>شحن المحفظة</h2>

    <select id="method" onchange="changeMethod()">
      <option value="">اختر طريقة الدفع</option>
      <option value="libyana">ليبيانا</option>
      <option value="bank">تحويل مصرفي</option>
    </select>

    <div id="paymentInfo" class="info hidden"></div>

    <input
      type="number"
      id="amount"
      placeholder="مبلغ الشحن بالدينار"
    >

    <input
      type="text"
      id="senderNumber"
      placeholder="رقم الهاتف الذي أرسلت منه"
    >

    <input
      type="text"
      id="referenceNumber"
      placeholder="رقم العملية / المرجع (اختياري)"
    >

    <label style="display:block;margin-top:15px;">
      صورة إثبات التحويل
    </label>

    <input
      type="file"
      id="proof"
      accept="image/*"
    >

    <button onclick="submitDeposit()">
      إرسال طلب الشحن
    </button>

    <button onclick="logout()" style="background:#b00020;">
      تسجيل الخروج
    </button>

    <div id="depositMessage"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://evqmpbhozwpujjrxkbat.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4n7k-PEyPPNA9RcFVMa4Cg_lqW19wZu";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   إرسال OTP
========================= */

async function sendOTP() {

  const email =
    document.getElementById("email").value.trim();

  const message =
    document.getElementById("message");

  if (!email) {
    message.innerText =
      "اكتب البريد الإلكتروني أولاً";
    return;
  }

  message.innerText =
    "جاري إرسال الرمز...";

  const { error } =
    await supabaseClient.auth.signInWithOtp({

      email: email,

      options: {
        shouldCreateUser: true
      }

    });

  if (error) {

    message.innerText =
      "حدث خطأ: " + error.message;

    return;
  }

  message.innerText =
    "تم إرسال رمز الدخول إلى بريدك الإلكتروني";

  document
    .getElementById("otpArea")
    .classList.remove("hidden");
}


/* =========================
   تأكيد OTP
========================= */

async function verifyOTP() {

  const email =
    document.getElementById("email").value.trim();

  const token =
    document.getElementById("otp").value.trim();

  const message =
    document.getElementById("message");

  if (!email || !token) {

    message.innerText =
      "أدخل البريد والرمز";

    return;
  }

  if (token.length !== 6) {

    message.innerText =
      "الرمز يجب أن يكون 6 أرقام";

    return;
  }

  message.innerText =
    "جاري التحقق...";

  const { data, error } =
    await supabaseClient.auth.verifyOtp({

      email: email,

      token: token,

      type: "email"

    });

  if (error) {

    message.innerText =
      "رمز غير صحيح أو منتهي: " +
      error.message;

    return;
  }

  message.innerText =
    "تم تسجيل الدخول بنجاح";

  document
    .getElementById("login")
    .classList.add("hidden");

  document
    .getElementById("account")
    .classList.remove("hidden");

  loadProfile();
}


/* =========================
   تحميل الحساب
========================= */

async function loadProfile() {

  const { data } =
    await supabaseClient.auth.getUser();

  if (!data.user) return;

  document.getElementById("userEmail")
    .innerText = data.user.email;

  const { data: profile, error } =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id", data.user.id)
      .single();

  if (!error && profile) {

    document.getElementById("balance")
      .innerText =
      Number(profile.balance).toFixed(2);
  }
}


/* =========================
   طريقة الدفع
========================= */

function changeMethod() {

  const method =
    document.getElementById("method").value;

  const info =
    document.getElementById("paymentInfo");

  if (method === "libyana") {

    info.classList.remove("hidden");

    info.innerHTML =
      "قم بالتحويل إلى رقم ليبيانا:<br><br>" +
      "<strong>0944528936</strong>";

  }

  else if (method === "bank") {

    info.classList.remove("hidden");

    info.innerHTML =
      "معلومات التحويل المصرفي سيتم وضعها هنا.";

  }

  else {

    info.classList.add("hidden");
    info.innerHTML = "";
  }
}


/* =========================
   إرسال طلب الشحن
========================= */

async function submitDeposit() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {

    alert("يجب تسجيل الدخول أولاً");
    return;
  }

  const method =
    document.getElementById("method").value;

  const amount =
    Number(document.getElementById("amount").value);

  const senderNumber =
    document.getElementById("senderNumber").value.trim();

  const referenceNumber =
    document.getElementById("referenceNumber").value.trim();

  const file =
    document.getElementById("proof").files[0];

  const message =
    document.getElementById("depositMessage");


  if (!method) {

    message.innerText =
      "اختر طريقة الدفع";

    return;
  }

  if (!amount || amount <= 0) {

    message.innerText =
      "أدخل مبلغ صحيح";

    return;
  }

  if (!senderNumber) {

    message.innerText =
      "أدخل رقم الهاتف الذي أرسلت منه";

    return;
  }

  if (!file) {

    message.innerText =
      "ارفع صورة إثبات التحويل";

    return;
  }


  message.innerText =
    "جاري إرسال الطلب...";


  /* رفع الصورة */

  const extension =
    file.name.split(".").pop();

  const fileName =
    user.id +
    "/" +
    crypto.randomUUID() +
    "." +
    extension;


  const { error: uploadError } =
    await supabaseClient.storage
      .from("payment-proofs")
      .upload(
        fileName,
        file
      );


  if (uploadError) {

    message.innerText =
      "فشل رفع الصورة: " +
      uploadError.message;

    return;
  }


  /* إنشاء طلب الشحن */

  const { error } =
    await supabaseClient
      .from("wallet_deposits")
      .insert({

        user_id: user.id,

        method: method,

        amount: amount,

        sender_number: senderNumber,

        reference_number:
          referenceNumber || null,

        proof_url: fileName,

        status: "pending"

      });


  if (error) {

    message.innerText =
      "حدث خطأ: " +
      error.message;

    return;
  }


  message.innerText =
    "تم إرسال طلب الشحن بنجاح. انتظر مراجعة الإدارة.";

  document.getElementById("amount").value = "";
  document.getElementById("senderNumber").value = "";
  document.getElementById("referenceNumber").value = "";
  document.getElementById("proof").value = "";
}


/* =========================
   تسجيل الخروج
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("account")
    .classList.add("hidden");

  document
    .getElementById("login")
    .classList.remove("hidden");

  document.getElementById("email").value = "";
  document.getElementById("otp").value = "";

  document
    .getElementById("otpArea")
    .classList.add("hidden");

  document.getElementById("message").innerText = "";
}


/* =========================
   فحص الجلسة عند فتح الموقع
========================= */

async function checkSession() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();

  if (session) {

    document
      .getElementById("login")
      .classList.add("hidden");

    document
      .getElementById("account")
      .classList.remove("hidden");

    loadProfile();

  } else {

    document
      .getElementById("login")
      .classList.remove("hidden");

    document
      .getElementById("account")
      .classList.add("hidden");
  }
}


checkSession();

</script>

</body>
</html>
