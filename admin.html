<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    #message {
      text-align: center;
      margin: 20px;
      font-weight: bold;
    }
    .deposit {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .deposit p {
      margin: 8px 0;
    }
    .proof {
      max-width: 100%;
      max-height: 500px;
      margin: 15px 0;
      border-radius: 8px;
    }
    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .approve {
      background: #20a464;
      color: white;
    }
    .reject {
      background: #d93636;
      color: white;
    }
    .status {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>👑 لوحة الإدارة</h1>
  <p id="message">جاري التحقق من الحساب...</p>
  <div id="deposits"></div>
<script>
const SUPABASE_URL =
"https://evqmpbhozwpujjrxkbat.supabase.co";
const SUPABASE_KEY =
"sb_publishable_4n7k-PEyPPNA9RcFVMa4Cg_lqW19wZu";
const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
// التحقق من الأدمن
async function checkAdmin() {
  const { data: { user } } =
    await supabaseClient.auth.getUser();
  if (!user) {
    document.getElementById("message").textContent =
      "يجب تسجيل الدخول أولاً";
    return false;
  }
  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("is_admin")
      .eq("id", user.id)
      .single();
  if (error || !data || data.is_admin !== true) {
    document.getElementById("message").textContent =
      "❌ ليس لديك صلاحية الدخول إلى لوحة الإدارة";
    return false;
  }
  document.getElementById("message").textContent =
    "تم الدخول إلى لوحة الإدارة ✅";
  return true;
}
// تحميل طلبات الشحن
async function loadDeposits() {
  const { data, error } =
    await supabaseClient
      .from("wallet_deposits")
      .select("*")
      .order("created_at", {
        ascending: false
      });
  if (error) {
    console.error(error);
    document.getElementById("message").textContent =
      "حدث خطأ أثناء تحميل الطلبات: " +
      error.message;
    return;
  }
  const container =
    document.getElementById("deposits");
  container.innerHTML = "";
  if (!data || data.length === 0) {
    container.innerHTML =
      "<p style='text-align:center;'>لا توجد طلبات شحن.</p>";
    return;
  }
  for (const deposit of data) {
    const box =
      document.createElement("div");
    box.className = "deposit";
    let proofHTML =
      "<p>لا توجد صورة تحويل.</p>";
    // إنشاء رابط مؤقت للصورة
    if (deposit.proof_url) {
      const { data: signedData, error: signedError } =
        await supabaseClient.storage
          .from("payment-proofs")
          .createSignedUrl(
            deposit.proof_url,
            3600
          );
      if (!signedError && signedData) {
        proofHTML = `
          <p><strong>📸 صورة التحويل:</strong></p>
          <a href="${signedData.signedUrl}" target="_blank">
            <img
              class="proof"
              src="${signedData.signedUrl}"
              alt="صورة التحويل"
            >
          </a>
        `;
      }
    }
    let buttonsHTML = "";
    if (deposit.status === "pending") {
      buttonsHTML = `
        <button
          class="approve"
          onclick="approveDeposit('${deposit.id}')"
        >
          ✅ موافقة
        </button>
        <button
          class="reject"
          onclick="rejectDeposit('${deposit.id}')"
        >
          ❌ رفض
        </button>
      `;
    }
    box.innerHTML = `
      <p>
        <strong>🆔 رقم الطلب:</strong>
        ${deposit.id}
      </p>
      <p>
        <strong>👤 المستخدم:</strong>
        ${deposit.user_id}
      </p>
      <p>
        <strong>💳 طريقة الدفع:</strong>
        ${deposit.method}
      </p>
      <p>
        <strong>💰 المبلغ:</strong>
        ${Number(deposit.amount).toFixed(2)}
        د.ل
      </p>
      <p>
        <strong>📱 رقم المحول:</strong>
        ${deposit.sender_number}
      </p>
      <p>
        <strong>📅 التاريخ:</strong>
        ${new Date(deposit.created_at).toLocaleString("ar-LY")}
      </p>
      <p class="status">
        <strong>الحالة:</strong>
        ${deposit.status}
      </p>
      ${proofHTML}
      <div>
        ${buttonsHTML}
      </div>
    `;
    container.appendChild(box);
  }
}
// الموافقة على الشحن
async function approveDeposit(id) {
  if (!confirm("هل أنت متأكد من الموافقة على هذا الطلب؟")) {
    return;
  }
  const { error } =
    await supabaseClient.rpc(
      "approve_deposit",
      {
        deposit_id: id
      }
    );
  if (error) {
    alert(
      "حدث خطأ: " +
      error.message
    );
    return;
  }
  alert("تمت الموافقة وإضافة الرصيد ✅");
  await loadDeposits();
}
// رفض الشحن
async function rejectDeposit(id) {
  if (!confirm("هل أنت متأكد من رفض هذا الطلب؟")) {
    return;
  }
  const { error } =
    await supabaseClient.rpc(
      "reject_deposit",
      {
        deposit_id: id
      }
    );
  if (error) {
    alert(
      "حدث خطأ: " +
      error.message
    );
    return;
  }
  alert("تم رفض الطلب ❌");
  await loadDeposits();
}
// تشغيل لوحة الإدارة
async function start() {
  const isAdmin =
    await checkAdmin();
  if (!isAdmin) {
    return;
  }
  await loadDeposits();
}
start();
</script>
</body>
</html>
